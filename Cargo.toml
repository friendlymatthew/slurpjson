[package]
name = "slurpjson"
authors = ["Matthew Kim"]
description = "json parsing through compute shaders"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
wgpu = "24.0.1"
env_logger = "0.10.1"
pollster = "0.3"
futures-intrusive = "0.5"
bytemuck = { version = "1.14", features = ["derive"] }
anyhow = "1.0.102"

[dev-dependencies]
insta = "1.47.2"
